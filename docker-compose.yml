services:
  redis:
    image: redis:8.10.3
    container_name: benchmark-redis
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 1500mb
      - --maxmemory-policy
      - noeviction
    ports:
      - "6379:6379"
    cpus: 2.0
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 1s
      retries: 30

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v2.0.0
    container_name: benchmark-dragonfly
    command: ["--logtostderr", "--maxmemory=1500mb"]
    ports:
      - "6380:6379"
    cpus: 2.0
    mem_limit: 2g
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -h 127.0.0.1 -p 6379 ping"]
      interval: 2s
      timeout: 1s
      retries: 30
