name: Go checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - name: Resolve and verify Go module dependencies
        run: go mod tidy
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/bench
